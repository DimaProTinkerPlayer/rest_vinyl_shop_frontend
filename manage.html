<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Керування магазином — Vinyl Shop</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 2rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        nav a { color: #38bdf8; text-decoration: none; margin-right: 1rem; }
        .btn-logout { background: #ef4444; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-left: 0.8rem; }
        .container { max-width: 700px; margin: 0 auto; display: grid; gap: 2rem; }
        .panel { background: #1e293b; padding: 1.5rem; border-radius: 8px; }
        label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #cbd5e1; }
        input, select { width: 100%; padding: 0.6rem; margin-top: 0.3rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button[type="submit"] { margin-top: 1.2rem; padding: 0.6rem 1.2rem; background: #38bdf8; color: #0f172a; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; }
        .status { margin-top: 0.8rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav id="navbar"></nav>

    <div class="container">
        <div class="panel">
            <h2>Додати нову платівку (Авторизовані користувачі)</h2>
            <form id="record-form">
                <label>Назва альбому</label>
                <input type="text" id="album" required>
                <label>Виконавець</label>
                <select id="artist_id" required></select>
                <label>Жанр</label>
                <select id="genre_id" required></select>
                <label>Ціна ($)</label>
                <input type="number" step="0.01" id="price" required>
                <label>Рік випуску</label>
                <input type="number" id="year" value="2020" required>
                <label>URL обкладинки</label>
                <input type="url" id="cover_image" placeholder="https://...">
                <button type="submit">Зберегти платівку</button>
            </form>
            <div id="record-status" class="status"></div>
        </div>

        <div class="panel" id="admin-panel" style="display: none;">
            <h2>Додати новий жанр (Лише Admin)</h2>
            <form id="genre-form">
                <label>Назва жанру</label>
                <input type="text" id="genre-name" required>
                <button type="submit">Створити жанр</button>
            </form>
            <div id="genre-status" class="status"></div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        async function initManagePage() {
            const user = await requireAuth();
            if (!user) return;

            renderNavbar();

            if (user.is_staff) {
                document.getElementById('admin-panel').style.display = 'block';
            }

            await loadDropdowns();
        }

        async function loadDropdowns() {
            const [artistsRes, genresRes] = await Promise.all([
                fetch(`${API_BASE_URL}/artists`),
                fetch(`${API_BASE_URL}/genres`)
            ]);
            const artists = await artistsRes.json();
            const genres = await genresRes.json();

            document.getElementById('artist_id').innerHTML = artists
                .map(a => `<option value="${a.id}">${a.name}</option>`).join('');
            document.getElementById('genre_id').innerHTML = genres
                .map(g => `<option value="${g.id}">${g.name}</option>`).join('');
        }

        document.getElementById('record-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('record-status');

            const payload = {
                album: document.getElementById('album').value,
                artist_id: Number(document.getElementById('artist_id').value),
                genre_id: Number(document.getElementById('genre_id').value),
                price: document.getElementById('price').value,
                year: Number(document.getElementById('year').value),
                cover_image: document.getElementById('cover_image').value,
            };

            const res = await authFetch('/records', {
                method: 'POST',
                body: JSON.stringify(payload),
            });

            if (res.ok) {
                statusEl.style.color = '#4ade80';
                statusEl.textContent = 'Платівку успішно додано!';
                e.target.reset();
            } else {
                const err = await res.json();
                statusEl.style.color = '#f87171';
                statusEl.textContent = `Помилка (${res.status}): ${JSON.stringify(err)}`;
            }
        });

        document.getElementById('genre-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusEl = document.getElementById('genre-status');

            const res = await authFetch('/genres', {
                method: 'POST',
                body: JSON.stringify({ name: document.getElementById('genre-name').value }),
            });

            if (res.ok) {
                statusEl.style.color = '#4ade80';
                statusEl.textContent = 'Жанр створено!';
                e.target.reset();
                await loadDropdowns();
            } else {
                const err = await res.json();
                statusEl.style.color = '#f87171';
                statusEl.textContent = `Помилка (${res.status}): ${err.detail || JSON.stringify(err)}`;
            }
        });

        initManagePage();
    </script>
</body>
</html>
