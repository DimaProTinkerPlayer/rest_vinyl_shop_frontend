<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Vinyl Shop</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 2rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
        nav a { color: #38bdf8; text-decoration: none; margin-right: 1rem; }
        .form-box { max-width: 420px; margin: 2rem auto; background: #1e293b; padding: 2rem; border-radius: 8px; }
        label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #cbd5e1; }
        input { width: 100%; padding: 0.6rem; margin-top: 0.3rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { width: 100%; margin-top: 1.5rem; padding: 0.7rem; background: #38bdf8; color: #0f172a; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; }
        .error { color: #f87171; margin-top: 1rem; font-size: 0.9rem; white-space: pre-line; }
    </style>
</head>
<body>
    <nav id="navbar"></nav>

    <div class="form-box">
        <h2>Реєстрація</h2>
        <form id="register-form">
            <label>Username *</label>
            <input type="text" id="username" required maxlength="150">
            <label>Ім'я (необов'язково)</label>
            <input type="text" id="first_name" maxlength="150">
            <label>Прізвище (необов'язково)</label>
            <input type="text" id="last_name" maxlength="150">
            <label>Email *</label>
            <input type="email" id="email" required maxlength="254">
            <label>Пароль *</label>
            <input type="password" id="password" required minlength="8">
            <label>Підтвердження пароля *</label>
            <input type="password" id="password_confirmation" required>
            <button type="submit">Зареєструватися</button>
        </form>
        <div id="error-msg" class="error"></div>
    </div>

    <script src="api.js"></script>
    <script>
        requireGuest();
        renderNavbar();

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = '';

            const payload = {
                username: document.getElementById('username').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password_confirmation: document.getElementById('password_confirmation').value,
            };

            const response = await fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });

            const data = await response.json();

            if (!response.ok) {
                const errors = data.error || data;
                errorEl.textContent = Object.entries(errors)
                    .map(([field, msgs]) => `${field}: ${Array.isArray(msgs) ? msgs.join(', ') : msgs}`)
                    .join('\n');
                return;
            }

            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
